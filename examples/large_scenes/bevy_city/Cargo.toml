[package]
name = "bevy_city"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { path = "../../../", features = [
  "https",
  "free_camera",
  "bevy_feathers",
  "web_asset_cache",
  "bevy_dev_tools",
] }

argh = "0.1"
noise = "0.9.0"
rand = "0.10.0"
bytes = "1.12.1"
moq-net = "0.3.13"
moq-mux = "0.10.14"
moq-tokio = "0.19.26"
hang = "0.21.14"
moq-video = { version = "0.1.13", features = ["nvidia", "openh264", "vaapi"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync"] }
tracing = "0.1.44"
serde = { version = "1.0.229", features = ["derive"] }
anyhow = "1.0.104"
moq-json = "0.5.12"
url = "2.5.8"

[lints]
workspace = true
